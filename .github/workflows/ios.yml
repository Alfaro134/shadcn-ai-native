name: iOS

# Builds the example app for the iOS simulator and drives it with Maestro. The screenshots, uploaded
# as an artifact, are the review: iOS is where streaming layout and the keyboard differ most from
# Android, and nobody on the project has a Mac.
#
# The simulator job is a required check on main, so the workflow runs on every pull request (a
# path filter would leave the check pending forever on a docs-only change). The `changes` job
# skips the 25-minute build when no app file changed; a skipped job counts as passing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: 2.11.0
  # The XCTest driver takes ~80 s to start on a cold runner, close to Maestro's default limit.
  MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
  OUT: ${{ github.workspace }}/maestro-output

jobs:
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Manual runs, new branches and unknown bases always build.
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qE '^(components/|example/|.github/workflows/ios.yml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  simulator:
    name: Build and drive on an iPhone simulator
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: example/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
        working-directory: example

      # Generates ios/ (git-ignored) and installs the pods.
      - run: npx expo prebuild --platform ios --no-install && cd ios && pod install
        working-directory: example

      # Release embeds the JS bundle, so the app runs without Metro.
      - name: Build for the simulator
        working-directory: example/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=${WORKSPACE%.xcworkspace}
          set -o pipefail
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -50

      - name: Boot a simulator and install the app
        run: |
          # Software keyboard on, so the screenshots show how the input follows it.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))] | last | .udid')
          xcrun simctl list devices available | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" example/ios/build/Build/Products/Release-iphonesimulator/*.app
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Drive the app (light)
        run: |
          mkdir -p "$OUT" && cd "$OUT"
          maestro --device "$UDID" test "$GITHUB_WORKSPACE/example/.maestro/chat.yaml" \
            --test-output-dir "$OUT/light" --debug-output "$OUT/light-debug"

      - name: Drive the app (dark)
        if: ${{ !cancelled() }}
        run: |
          xcrun simctl ui "$UDID" appearance dark
          cd "$OUT"
          maestro --device "$UDID" test "$GITHUB_WORKSPACE/example/.maestro/dark-mode.yaml" \
            --test-output-dir "$OUT/dark" --debug-output "$OUT/dark-debug"

      # Always, so a failed or cancelled run still shows where the app was.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: ios-screenshots
          path: maestro-output
          if-no-files-found: warn
