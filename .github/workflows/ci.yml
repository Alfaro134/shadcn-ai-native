name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run bench

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: example/package-lock.json
      - run: npm ci
        working-directory: example
      - run: npx tsc --noEmit
        working-directory: example
