version: 2
updates:
  # Pinned action SHAs in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Dev tooling at the repo root (ESLint, TypeScript).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns: ["*"]
    ignore:
      # typescript-eslint supports TypeScript < 6.1; a major bump fails with a peer conflict.
      # Lift this once typescript-eslint's peer range includes the new major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The example app: no version-update PRs. The Expo SDK pins exact, mutually compatible versions
  # (React, React Native, Reanimated, Worklets, and Tailwind 3 for NativeWind v4), and in Expo Go
  # the native side of Reanimated/Worklets is fixed, so a JS-only bump breaks the app at runtime.
  # Upgrade with `npx expo install --fix` when moving to a new SDK. Dependabot *security* updates
  # (enabled in the repo settings) still open PRs here.
  - package-ecosystem: npm
    directory: /example
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
